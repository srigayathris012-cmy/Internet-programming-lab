<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Portal | Login</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI, sans-serif;
}

body{
background:#F5F7FB;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
width:400px;
background:#fff;
padding:35px;
border-radius:18px;
box-shadow:0 10px 30px rgba(0,0,0,.1);
}

.logo{
text-align:center;
font-size:35px;
margin-bottom:10px;
}

h2{
text-align:center;
color:#1E293B;
margin-bottom:8px;
}

.subtitle{
text-align:center;
color:#64748B;
margin-bottom:25px;
font-size:15px;
}

.input-group{
margin-bottom:18px;
}

label{
display:block;
margin-bottom:8px;
font-weight:600;
color:#334155;
}

input{
width:100%;
padding:12px;
border:1px solid #D1D5DB;
border-radius:8px;
font-size:15px;
}

input:focus{
outline:none;
border-color:#2563EB;
}

.password-box{
position:relative;
}

.password-box span{
position:absolute;
right:15px;
top:13px;
cursor:pointer;
font-size:14px;
color:#2563EB;
}

.row{
display:flex;
justify-content:space-between;
align-items:center;
font-size:14px;
margin-bottom:20px;
}

.row a{
text-decoration:none;
color:#2563EB;
}

button{
width:100%;
padding:13px;
background:#2563EB;
color:white;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#1D4ED8;
}

.google-btn{
margin-top:15px;
background:white;
color:#333;
border:1px solid #D1D5DB;
}

.google-btn:hover{
background:#f8f8f8;
}

.bottom{
text-align:center;
margin-top:20px;
font-size:15px;
}

.bottom a{
text-decoration:none;
color:#2563EB;
font-weight:bold;
}

.error{
color:red;
font-size:13px;
margin-top:5px;
}

</style>

</head>
<body>

<div class="container">

<div class="logo"></div>

<h2>Welcome Back</h2>

<p class="subtitle">
Login to continue your career journey
</p>

<form onsubmit="return validateLogin()">

<div class="input-group">
<label>Email</label>
<input type="email" id="email">
<div id="emailError" class="error"></div>
</div>

<div class="input-group">

<label>Password</label>

<div class="password-box">

<input type="password" id="password">

<span onclick="togglePassword()">👁</span>

</div>

<div id="passwordError" class="error"></div>

</div>

<div class="row">

<label>
<input type="checkbox">
 Remember Me
</label>

<a href="#">Forgot Password?</a>

</div>

<button type="submit">
Login
</button>

<button class="google-btn" type="button">
Continue with Google
</button>

<div class="bottom">

Don't have an account?

<a href="register.html">
Register
</a>

</div>

</form>

</div>

<script>

function togglePassword(){

let pass=document.getElementById("password");

pass.type=pass.type==="password"?"text":"password";

}

function validateLogin(){

let email=document.getElementById("email").value.trim();

let password=document.getElementById("password").value.trim();

let emailPattern=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;

document.getElementById("emailError").innerHTML="";
document.getElementById("passwordError").innerHTML="";

if(email==""){
document.getElementById("emailError").innerHTML="Email is required";
return false;
}

if(!email.match(emailPattern)){
document.getElementById("emailError").innerHTML="Enter a valid email";
return false;
}

if(password==""){
document.getElementById("passwordError").innerHTML="Password is required";
return false;
}

if(password.length<6){
document.getElementById("passwordError").innerHTML="Minimum 6 characters";
return false;
}

alert("Login Successful!");

return true;

}

</script>

</body>
</html>
